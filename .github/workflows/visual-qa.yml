name: Visual QA - screenshots

# Visual Factory, inspeção: roda o jogo com tela virtual (xvfb + OpenGL por software),
# visita cenas fixas de dia e de noite e guarda os PNG como artefato "fotos".
# Não bloqueia a publicação do jogo.
on:
  push:
    branches: [main]
    paths: ["godot/**", "ferramentas/**", ".github/workflows/visual-qa.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  fotos:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4
      - name: Peças de cenário
        run: |
          pip install --quiet pillow numpy
          python3 ferramentas/desenhar_pecas.py
          python3 ferramentas/processar_objetos.py arte/objetos godot/assets/objetos
      - name: Godot e tela virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libxcursor1 libxinerama1 libxrandr2 libxi6 > /dev/null
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 $HOME/godot
          $HOME/godot --headless --path godot --import > /dev/null 2>&1 || true
      - name: Fotografar as cenas
        run: |
          mkdir -p fotos
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" $HOME/godot --path godot --rendering-driver opengl3 \
            --resolution 1280x720 -- --teste-fotos=$GITHUB_WORKSPACE/fotos 2>&1 | tee fotos.log || true
          ls -la fotos
          python3 ferramentas/vf/folha_contato.py fotos fotos/_folha.png || true
      - name: Guardar as fotos no ramo visual-qa
        run: |
          # fotos em JPG (menores) num ramo separado, substituído a cada rodada
          cd fotos
          for f in *.png; do convert "$f" -quality 85 "${f%.png}.jpg" && rm "$f"; done
          cp ../fotos.log .
          git init -q
          git checkout -q -b visual-qa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Fotos da inspeção visual do commit ${GITHUB_SHA::7}" > LEIA-ME.txt
          git add -A
          git commit -qm "fotos ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" visual-qa
