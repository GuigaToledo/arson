name: Godot - build web

# A cada push que mexe no projeto Godot: importa, roda a cena por alguns
# segundos para pegar erros de script, exporta para a web e publica em /jogo/.
on:
  push:
    branches: [main]
    paths: ["godot/**", "arte/**", "ferramentas/**", ".github/workflows/godot-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Peças de cenário (remove fundo)
        run: |
          pip install --quiet pillow
          python3 ferramentas/processar_objetos.py arte/objetos godot/assets/objetos

      - name: Gerar 3D grátis (Hunyuan3D no Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$(python3 ferramentas/gerar_3d.py --listar)" ]; then
            pip install --quiet gradio_client rembg onnxruntime
            timeout 1500 python3 ferramentas/gerar_3d.py || true
          fi

      - name: Rig e animação automáticos (Blender)
        run: |
          for m in arte/modelos_gerados/*; do
            [ -f "$m" ] || continue
            n=$(basename "${m%.*}")
            [ -f "arte/personagens/$n/modelo.glb" ] && continue
            rot=$(python3 -c "import json,sys;print(json.load(open('arte/gerar3d/personagens/$n.json')).get('rotacao',0))" 2>/dev/null || echo 0)
            bash ferramentas/blender.sh -b --factory-startup -P ferramentas/blender_autorig.py -- "$m" "arte/personagens/$n" "$rot" 2>&1 | grep -vE "^Fra:|^Info" | tail -30
          done

      - name: Personagens que mudaram
        id: chars
        run: |
          list=""
          for d in arte/personagens/*/; do
            [ -f "$d/config.json" ] || continue
            n=$(basename "$d")
            h=$( (cat ferramentas/blender_sprites.py ferramentas/montar_sprites.py; find "$d" -type f | sort | xargs cat) | sha1sum | cut -c1-16)
            if [ "$(cat godot/assets/personagens/$n/hash.txt 2>/dev/null)" != "$h" ]; then list="$list $n:$h"; fi
          done
          echo "list=$list" >> $GITHUB_OUTPUT
          echo "Para renderizar:$list"

      - name: Renderizar personagens no Blender (8 direções)
        if: steps.chars.outputs.list != ''
        run: |
          for item in ${{ steps.chars.outputs.list }}; do
            n=${item%%:*}; h=${item##*:}
            rm -rf /tmp/render_$n
            bash ferramentas/blender.sh -b --factory-startup -P ferramentas/blender_sprites.py -- "arte/personagens/$n" "/tmp/render_$n" 2>&1 | grep -vE "^Fra:|Rendering|Sample|Denois|Path Tracing|Synchroniz|Updating|Loading|Finished|Saved:" | tail -40
            rm -rf "godot/assets/personagens/$n"
            python3 ferramentas/montar_sprites.py "/tmp/render_$n" "godot/assets/personagens/$n" "$n"
            echo "$h" > "godot/assets/personagens/$n/hash.txt"
          done

      - name: Baixar Godot e modelos de exportação
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 $HOME/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Importar recursos
        run: $HOME/godot --headless --path godot --import 2>&1 | tee import.log || true

      - name: Rodar a cena (teste de erros)
        run: |
          timeout 120 $HOME/godot --headless --path godot --quit-after 300 2>&1 | tee run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" import.log run.log; then
            echo "::error::Erros de script encontrados"
            exit 1
          fi

      - name: Exportar para web
        run: |
          mkdir -p jogo
          $HOME/godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/jogo/index.html" 2>&1 | tee export.log
          test -f jogo/index.pck
          cp godot/web/arson_net.js jogo/

      - name: Publicar em /jogo/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jogo godot/assets arte
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "build: jogo web (${GITHUB_SHA::7})"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
