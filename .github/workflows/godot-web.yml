name: Godot - build web

# A cada push que mexe no projeto Godot: importa, roda a cena por alguns
# segundos para pegar erros de script, exporta para a web e publica na raiz (/arson/).
on:
  push:
    branches: [main]
    paths: ["godot/**", "arte/**", "ferramentas/**", ".github/workflows/godot-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - name: Peças de cenário (remove fundo)
        run: |
          pip install --quiet pillow
          python3 ferramentas/processar_objetos.py arte/objetos godot/assets/objetos

      - name: Baixar Godot e modelos de exportação
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 $HOME/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Importar recursos
        run: $HOME/godot --headless --path godot --import 2>&1 | tee import.log || true

      - name: Rodar a cena (teste de erros)
        run: |
          timeout 120 $HOME/godot --headless --path godot --quit-after 300 2>&1 | tee run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" import.log run.log; then
            echo "::error::Erros de script encontrados"
            exit 1
          fi

      - name: Exportar para web
        run: |
          # a versão anterior continua no ar (quem ainda tem a página antiga em cache precisa dela)
          OLD=$(grep -o 'index-[0-9a-f]*.pck' index.html 2>/dev/null | head -1 || true)
          $HOME/godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/index.html" 2>&1 | tee export.log
          test -f index.pck
          cp godot/web/arson_net.js .
          # nome único por versão: o navegador nunca mistura arquivo novo com antigo do cache
          V=${GITHUB_SHA::7}
          for p in index-*.pck; do [ -f "$p" ] && [ "$p" != "$OLD" ] && git rm -q -f "$p" || true; done
          mv index.pck index-$V.pck
          sed -i "s#\"executable\":\"index\"#\"executable\":\"index\",\"mainPack\":\"index-$V.pck\"#; s#\"index.pck\":#\"index-$V.pck\":#; s#src=\"arson_net.js\"#src=\"arson_net.js?v=$V\"#" index.html
          grep -q "index-$V.pck" index.html
          echo "{\"v\":\"$V\"}" > version.json

      - name: Publicar em /arson/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A index.html index.js index-*.pck version.json index.wasm index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js arson_net.js godot/assets arte
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "build: jogo web (${GITHUB_SHA::7})"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
